name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # go.mod sets Go 1.26 as the floor (the templ release the UI uses needs
        # it). Older versions can't build this module. Add each new Go release here.
        go: ['1.26', '1.27']
    env:
      # Without this, Go silently downloads a newer toolchain when go.mod asks
      # for one, so a matrix entry could end up testing a different Go version.
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go ${{ matrix.go }}
        # setup-go caches the module and build caches itself, keyed on go.sum.
        # Adding actions/cache on the same paths makes the two restores collide.
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      - name: go vet
        run: go vet ./...

      - name: gofmt (fail on unformatted)
        # `gofmt -l` lists unformatted files. If any output appears we fail
        # with the file list so the offender is obvious in CI logs.
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt detected unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: go test (unit)
        run: go test ./...

      - name: go test (integration)
        # The integration suite spins up real SSH listeners on loopback and
        # scrapes /metrics via HTTP — no external services required.
        run: go test -tags integration ./...

      - name: go build
        run: go build ./...

  ui:
    # The web UI's committed generated files (templ Go code, built CSS) must
    # match their sources, and the simulator binaries must not link the UI
    # (docs/UI-ARCHITECTURE.md 11.4, 12.4). No Node, no browsers: make
    # ui-check fetches the checksum-pinned Tailwind standalone CLI.
    name: ui (generated files, import boundary)
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: make ui-check
        run: make ui-check

      - name: Import boundary
        run: go test -count=1 -run TestImportBoundary ./cmd/rcfg-sim/
